<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h2>Coffee House ☕</h2>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#menu">Menu</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero" id="home">
    <h1>Fresh Coffee Every Day</h1>
    <p>Enjoy the best coffee in town.</p>

    <button onclick="orderNow()">Order Now</button>
    <button onclick="viewMenu()">View Menu</button>
</section>

<section class="menu" id="menu">
    <h2>Our Menu</h2>

    <div class="card">
        <h3>Espresso</h3>
        <p>$3.50</p>
        <button onclick="buyCoffee('Espresso')">Buy</button>
    </div>

    <div class="card">
        <h3>Cappuccino</h3>
        <p>$4.50</p>
        <button onclick="buyCoffee('Cappuccino')">Buy</button>
    </div>

    <div class="card">
        <h3>Latte</h3>
        <p>$5.00</p>
        <button onclick="buyCoffee('Latte')">Buy</button>
    </div>
</section>

<section class="contact" id="contact">
    <h2>Contact Us</h2>
    <p>Email: coffee@example.com</p>
    <button onclick="contactUs()">Contact</button>
</section>

<script>
function orderNow(){
    alert("Thank you for choosing Coffee House!");
}

function viewMenu(){
    document.getElementById("menu").scrollIntoView({
        behavior: "smooth"
    });
}

function buyCoffee(name){
    alert("You selected " + name);
}

function contactUs(){
    alert("Email us at coffee@example.com");
}
</script>

</body>
</html>
